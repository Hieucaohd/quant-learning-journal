<div class="form-row"><label>Ngày <input type="date" name="date" value="{{ entry.date if entry else today }}" required></label><label>Khóa học <select name="course_id" required>{% for course in courses %}<option value="{{ course.id }}" {% if entry and entry.course_id == course.id %}selected{% endif %}>{{ course.name }}</option>{% endfor %}</select></label></div>
<div class="form-row"><label>Chủ đề <input name="topic" value="{{ entry.topic if entry else '' }}" placeholder="Đạo hàm"></label><label>Bài học <input name="lecture" value="{{ entry.lecture if entry else '' }}" placeholder="Bài 13"></label></div>
<div class="form-row three"><label>Số giờ <input type="number" name="hours" min="0.1" max="24" step="0.1" value="{{ entry.hours if entry else '' }}" required></label><label>Độ khó <select name="difficulty">{% for item in difficulties %}<option value="{{ item }}" {% if entry and entry.difficulty == item %}selected{% elif not entry and item == 'Trung bình' %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Mức độ hiểu (1–10) <input type="number" min="1" max="10" name="understanding" value="{{ entry.understanding or '' if entry else '' }}"></label></div>
<label>Điều đã học <textarea name="notes" rows="4" placeholder="Khái niệm, ví dụ, điều rút ra...">{{ entry.notes if entry else '' }}</textarea></label>
<label>Vướng mắc <textarea name="problems" rows="3" placeholder="Bạn gặp khó ở đâu?">{{ entry.problems if entry else '' }}</textarea></label>
<label>Kế hoạch ngày mai <textarea name="next_plan" rows="2" placeholder="Một bước tiếp theo cụ thể">{{ entry.next_plan if entry else '' }}</textarea></label>
