{% extends 'base.html' %}
{% block title %}Đổi mật khẩu · Lịch Kế Hoạch{% endblock %}
{% block content %}
<section class="card narrow auth-card">
  <p class="eyebrow">TÀI KHOẢN · @{{ g.user.username }}</p>
  <h1>Đổi mật khẩu</h1>
  <form method="post" class="form-grid">
    <label>Mật khẩu hiện tại <input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
    <label>Mật khẩu mới <input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Nhập lại mật khẩu mới <input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="button button-dark" type="submit">Lưu mật khẩu mới</button>
  </form>
</section>
{% endblock %}
