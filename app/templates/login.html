{% extends 'base.html' %}
{% block title %}Đăng nhập · Lịch Kế Hoạch{% endblock %}
{% block content %}
<section class="card narrow auth-card">
  <p class="eyebrow">LỊCH KẾ HOẠCH</p>
  <h1>Đăng nhập</h1>
  <p class="muted">Lập kế hoạch và xếp lịch theo thời gian bạn có. Mỗi tài khoản có kế hoạch, lịch và tiến độ riêng.</p>
  <form method="post" class="form-grid">
    <label>Tên đăng nhập <input name="username" autocomplete="username" required autofocus></label>
    <label>Mật khẩu <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button button-dark" type="submit">Đăng nhập</button>
  </form>
</section>
{% endblock %}
